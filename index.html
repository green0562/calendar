<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トライアングル参加カレンダー</title>

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

.month-title {
  font-weight: bold;
  font-size: 18px;
  margin: 20px 0 5px;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.header {
  text-align: center;
  font-weight: bold;
  background: #f0f0f0;
  padding: 5px;
}

.day {
  border: 1px solid #ccc;
  border-radius: 8px;
  min-height: 90px;
  padding: 5px;
}

.empty {
  border: none;
}

.sat {
  background: #e0f4ff;
}

.sun,
.holiday {
  background: #ffe6ea;
}

.date {
  font-size: 12px;
  font-weight: bold;
}

.names span {
  display: block;
  font-size: 11px;
  margin-top: 2px;
  background: #e0f0ff;
  border-radius: 4px;
  padding: 2px;
  cursor: pointer;
}

button {
  width: 100%;
  margin-top: 3px;
  font-size: 11px;
}

.error {
  color: red;
  font-weight: bold;
  margin: 10px 0;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>トライアングル参加カレンダー</h2>

<div id="error" class="error"></div>
<div id="app"></div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  updateDoc,
  onSnapshot,
  getDoc,
  arrayUnion,
  arrayRemove
} from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";


/* Firebase設定 */

const firebaseConfig = {
  apiKey: "AIzaSyAeqz0DS20ux7MWpmXrQA5x3rZ4KysrET8",
  authDomain: "triangle-29fbf.firebaseapp.com",
  projectId: "triangle-29fbf",
  storageBucket: "triangle-29fbf.firebasestorage.app",
  messagingSenderId: "606495480365",
  appId: "1:606495480365:web:cff5ea51104d63bd78f6a4",
  measurementId: "G-3QNBJ2XMXW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const appDiv = document.getElementById("app");
const errorDiv = document.getElementById("error");


/* 日付フォーマット */

function formatDateLocal(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}


/* 祝日取得 */

async function getHolidays() {

  try {

    const res = await fetch(
      "https://holidays-jp.github.io/api/v1/date.json"
    );

    return await res.json();

  } catch (error) {

    console.error("祝日取得エラー:", error);

    return {};

  }
}


/* 名前の正規化 */

function cleanName(str) {

  return str
    .normalize("NFKC")
    .replace(/\s/g, "")
    .replace(/△/g, "")
    .toLowerCase();

}


/* 月カレンダー作成 */

function createMonth(year, month, holidays) {

  const container = document.createElement("div");

  const title = document.createElement("div");

  title.className = "month-title";

  title.textContent =
    `${year}年${month + 1}月`;

  container.appendChild(title);


  const cal = document.createElement("div");

  cal.className = "calendar";


  ["月","火","水","木","金","土","日"].forEach(dayName => {

    const div = document.createElement("div");

    div.className = "header";

    div.textContent = dayName;

    cal.appendChild(div);

  });


  const firstDay = new Date(year, month, 1);

  const lastDate =
    new Date(year, month + 1, 0).getDate();


  const offset =
    (firstDay.getDay() + 6) % 7;


  for (let i = 0; i < offset; i++) {

    const empty = document.createElement("div");

    empty.className = "day empty";

    cal.appendChild(empty);

  }


  for (let i = 1; i <= lastDate; i++) {

    const d = new Date(year, month, i);

    const key = formatDateLocal(d);

    const day = d.getDay();


    const div = document.createElement("div");

    div.className = "day";


    const isSun = day === 0;

    const isSat = day === 6;

    const isHoliday = holidays[key];


    if (isHoliday) {

      div.classList.add("holiday");

    } else if (isSun) {

      div.classList.add("sun");

    } else if (isSat) {

      div.classList.add("sat");

    }


    div.innerHTML = `
      <div class="date">${i}</div>
      <div class="names" id="names-${key}"></div>
      <button onclick="addName('${key}')">＋参加</button>
    `;


    cal.appendChild(div);


    /* Firestore監視 */

    onSnapshot(

      doc(db, "dates", key),

      (docSnap) => {

        const namesContainer =
          document.getElementById("names-" + key);

        if (!namesContainer) return;

        namesContainer.innerHTML = "";


        if (docSnap.exists()) {

          const data = docSnap.data();

          const names =
            Array.isArray(data.names)
              ? data.names
              : [];


          names.forEach(name => {

            const span =
              document.createElement("span");

            span.textContent = name;


            span.onclick = async () => {

              const inputName =
                prompt("削除する名前を入力してください");

              if (!inputName) return;


              if (
                cleanName(name) !==
                cleanName(inputName)
              ) {

                alert("一致しません");

                return;

              }


              if (
                confirm(
                  `"${name}" を削除しますか？`
                )
              ) {

                try {

                  await updateDoc(
                    doc(db, "dates", key),
                    {
                      names: arrayRemove(name)
                    }
                  );

                } catch (error) {

                  console.error(error);

                  alert(
                    "削除できませんでした。\n" +
                    error.message
                  );

                }

              }

            };


            namesContainer.appendChild(span);

          });

        }

      },

      (error) => {

        console.error(
          "Firestore読み込みエラー:",
          error
        );

        errorDiv.textContent =
          "Firestore読み込みエラー:\n" +
          error.message;

      }

    );

  }


  container.appendChild(cal);

  return container;

}


/* 名前登録 */

window.addName = async function(key) {

  const name = prompt("名前を入力してください");

  if (!name) return;


  const trimmedName = name.trim();

  if (!trimmedName) return;


  try {

    const ref = doc(db, "dates", key);

    const docSnap = await getDoc(ref);


    if (docSnap.exists()) {

      const data = docSnap.data();

      const names =
        Array.isArray(data.names)
          ? data.names
          : [];


      const duplicate =
        names.some(
          existing =>
            cleanName(existing) ===
            cleanName(trimmedName)
        );


      if (duplicate) {

        alert("登録済みです");

        return;

      }

    }


    await setDoc(

      ref,

      {
        names: arrayUnion(trimmedName)
      },

      {
        merge: true
      }

    );


    alert("登録しました");

  } catch (error) {

    console.error(
      "Firebase登録エラー:",
      error
    );


    errorDiv.textContent =
      "登録エラー:\n" +
      error.message;


    alert(
      "登録できませんでした。\n\n" +
      error.message
    );

  }

};


/* カレンダー表示 */

async function init() {

  try {

    const holidays =
      await getHolidays();


    const today = new Date();

    const y = today.getFullYear();

    const m = today.getMonth();


    /*
      現在の月から12か月分表示
      これにより9月以降も自動的に表示されます
    */

    for (let i = 0; i < 12; i++) {

      const date =
        new Date(y, m + i, 1);

      appDiv.appendChild(
        createMonth(
          date.getFullYear(),
          date.getMonth(),
          holidays
        )
      );

    }

  } catch (error) {

    console.error(error);

    errorDiv.textContent =
      "初期化エラー:\n" +
      error.message;

  }

}


init();

</script>

</body>
</html>
