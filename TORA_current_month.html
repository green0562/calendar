<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORA カレンダー</title>

<style>
body { font-family: sans-serif; margin: 10px; }

.month-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.month-nav h2 {
  margin: 0;
  min-width: 70px;
  text-align: center;
}

.month-nav button {
  width: auto;
  margin: 0;
  padding: 6px 12px;
  font-size: 14px;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.header {
  font-weight: bold;
  text-align: center;
  padding: 5px;
  background: #f0f0f0;
}

.day {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 6px;
  min-height: 100px;
  box-sizing: border-box;
}

.sat { background: #e0f4ff; }
.sun { background: #ffe6ea; }
.holiday { background: #ffe6ea; }

.date { font-size: 16px; font-weight: bold; }

.names span {
  display:block;
  font-size:12px;
  margin-top:2px;
  background:#e0f0ff;
  border-radius:4px;
  padding:2px;
  cursor:pointer;
}

.add-button {
  margin-top:5px;
  width:100%;
  font-size:12px;
}

.name-form {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.name-input {
  box-sizing: border-box;
  min-width: 0;
  width: 100%;
  font-size: 16px;
  padding: 7px 6px;
  border: 1px solid #aaa;
  border-radius: 4px;
  background: #fff;
  color: #222;
  -webkit-appearance: none;
}

.name-submit,
.name-cancel {
  width: auto;
  min-width: 44px;
  margin-top: 0;
  padding: 6px 8px;
  font-size: 12px;
}

.blank {
  visibility: hidden;
  border: none;
}

@media (max-width: 600px) {
  .day { min-height: 85px; padding: 4px; }
  .date { font-size: 14px; }
  .names span { font-size: 11px; }
  .month-nav button { padding: 6px 9px; }
}
</style>
</head>

<body>

<div class="month-nav">
  <button id="prevMonth">‹ 前月</button>
  <h2 id="monthTitle"></h2>
  <button id="nextMonth">次月 ›</button>
</div>

<div id="calendar" class="calendar"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, updateDoc, onSnapshot,
  getDoc, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeqz0DS20ux7MWpmXrQA5x3rZ4KysrET8",
  authDomain: "triangle-29fbf.firebaseapp.com",
  projectId: "triangle-29fbf",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");

let displayDate = new Date();
displayDate = new Date(displayDate.getFullYear(), displayDate.getMonth(), 1);
let unsubscribeList = [];

function formatDateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

async function getHolidays() {
  const res = await fetch("https://holidays-jp.github.io/api/v1/date.json");
  return await res.json();
}

function clearListeners() {
  unsubscribeList.forEach(unsubscribe => unsubscribe());
  unsubscribeList = [];
}

function addNameForm(div, key) {
  const existing = div.querySelector(".name-form");
  if (existing) {
    existing.querySelector(".name-input").focus();
    return;
  }

  const form = document.createElement("div");
  form.className = "name-form";
  form.innerHTML = `
    <input class="name-input" type="text" maxlength="30"
           placeholder="名前を入力" autocomplete="name" enterkeyhint="done">
    <button type="button" class="name-submit">登録</button>
    <button type="button" class="name-cancel">取消</button>
  `;
  div.appendChild(form);

  const input = form.querySelector(".name-input");
  const submit = form.querySelector(".name-submit");
  const cancel = form.querySelector(".name-cancel");

  const submitName = async () => {
    const name = input.value.trim();
    if (!name) {
      input.focus();
      return;
    }

    submit.disabled = true;
    try {
      await addName(key, name);
      form.remove();
    } catch (error) {
      console.error(error);
      alert("登録できませんでした。通信状態とFirebaseの設定を確認してください。");
      submit.disabled = false;
      input.focus();
    }
  };

  submit.addEventListener("click", submitName);
  cancel.addEventListener("click", () => form.remove());
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") submitName();
    if (event.key === "Escape") form.remove();
  });

  requestAnimationFrame(() => input.focus());
}

async function createCalendar() {
  clearListeners();
  calendar.innerHTML = "";

  const holidays = await getHolidays();

  const year = displayDate.getFullYear();
  const month = displayDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  // 「8月」「9月」のように月だけ表示
  monthTitle.textContent = `${month + 1}月`;

  // 曜日（月曜始まり）
  ["月","火","水","木","金","土","日"].forEach(day => {
    const div = document.createElement("div");
    div.className = "header";
    div.textContent = day;
    calendar.appendChild(div);
  });

  // 月初までの空白（月曜始まり）
  const firstWeekday = (firstDay.getDay() + 6) % 7;
  for (let i = 0; i < firstWeekday; i++) {
    const blank = document.createElement("div");
    blank.className = "day blank";
    calendar.appendChild(blank);
  }

  for (let i = 0; i < daysInMonth; i++) {
    const d = new Date(year, month, i + 1);
    const key = formatDateLocal(d);
    const day = d.getDay();

    const div = document.createElement("div");
    div.className = "day";

    if (holidays[key]) {
      div.classList.add("holiday");
    } else if (day === 0) {
      div.classList.add("sun");
    } else if (day === 6) {
      div.classList.add("sat");
    }

    div.innerHTML = `
      <div class="date">${d.getDate()}</div>
      <div class="names" id="names-${key}"></div>
      <button class="add-button" type="button">参加</button>
    `;

    calendar.appendChild(div);

    div.querySelector(".add-button").addEventListener("click", () => {
      addNameForm(div, key);
    });

    const unsubscribe = onSnapshot(doc(db, "dates", key), docSnap => {
      const container = div.querySelector(".names");
      if (!container) return;
      container.innerHTML = "";

      if (docSnap.exists()) {
        const names = docSnap.data().names || [];

        names.forEach(name => {
          const span = document.createElement("span");
          span.textContent = name;
          span.title = "タップすると削除できます";

          span.onclick = async () => {
            if (confirm(`${name} さんを削除しますか？`)) {
              try {
                await updateDoc(doc(db, "dates", key), {
                  names: arrayRemove(name)
                });
              } catch (error) {
                console.error(error);
                alert("削除できませんでした。通信状態とFirebaseの設定を確認してください。");
              }
            }
          };

          container.appendChild(span);
        });
      }
    }, error => {
      console.error("Firestore読み取りエラー:", error);
    });

    unsubscribeList.push(unsubscribe);
  }
}

async function addName(key, name) {
  const ref = doc(db, "dates", key);
  const docSnap = await getDoc(ref);

  if (docSnap.exists() && docSnap.data().names?.includes(name)) {
    alert("この名前はすでに登録されています。");
    return;
  }

  await setDoc(ref, {
    names: arrayUnion(name)
  }, { merge: true });
}

document.getElementById("prevMonth").addEventListener("click", () => {
  displayDate = new Date(displayDate.getFullYear(), displayDate.getMonth() - 1, 1);
  createCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
  displayDate = new Date(displayDate.getFullYear(), displayDate.getMonth() + 1, 1);
  createCalendar();
});

createCalendar();
</script>

</body>
</html>
